<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Random Jigsaw — No Preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Random Jigsaw</h1>
      <div id="timer">00:00</div>
    </header>

    

    <section>
      <div id="message">Loading puzzle…</div>
      <div id="board" aria-label="Jigsaw puzzle"></div>
    </section>

    <div class="buttons">
      <button id="shuffle">Shuffle</button>
      <button id="newPuzzle">New puzzle</button>
    </div>
  </main>
  <script src="puzzle.js"></script>
</body>
</html>
